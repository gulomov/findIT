build-job:
  stage: build
  image: androidsdk/android-30:latest
  variables:
    ANDROID_HOME: /sdk
    ANDROID_SDL_ROOT: /sdk
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradlew"
  cache:
    key: gradle-cache
    paths:
      - .gradle-cache
      - build
    script:
      - chmod +x /.gradlew
      - ./gradlew build --stacktrace
    artifacts:
      paths:
        - app/build/outputs/
        - build/outputs/
