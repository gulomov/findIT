build-job:
  stage: build
  image: openjdk:17
  variables:
    ANDROID_HOME: $CI_PROJECT_DIR/android-sdk
    ANDROID_SDK_ROOT: $CI_PROJECT_DIR/android-sdk
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: gradle-cache
    paths:
      - .gradle/
      - android-sdk/
  before_script:
    - apt-get update && apt-get install -y wget unzip git curl
    # Download Android command line tools
    - wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
    # Install required SDK components
    - yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0"
  script:
    - chmod +x ./gradlew
    - ./gradlew build --stacktrace
  artifacts:
    paths:
      - app/build/outputs/
      - build/outputs/
